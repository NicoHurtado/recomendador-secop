# Verificación del repositorio: MLOps (lint, formato y pruebas con PostgreSQL) y página web (lint, pruebas y build).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mlops:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 03-mlops
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: prueba
          POSTGRES_DB: secop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d secop"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:prueba@localhost:5432/secop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: 03-mlops/requirements-*.txt
      - name: Dependencias
        run: pip install -r requirements-dev.txt -r requirements-ml.txt
      - name: Lint y formato
        run: ruff check . && ruff format --check .
      - name: Pruebas
        run: pytest -q -rs

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 04-visualizacion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 04-visualizacion/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
